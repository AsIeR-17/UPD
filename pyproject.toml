[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upd-tool"
version = "0.2.3"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "AsIeR-17" }]
description = "CLI tool to control all your package managers"
readme = "README.md"
license = "MIT"
keywords = ["package managers", "package manager"]

[project.urls]
Repository = "https://github.com/AsIeR-17/UPD"
Issues = "https://github.com/AsIeR-17/UPD/issues"

[project.scripts]
upd = "upd:main"

[tool.setuptools]
py-modules = ["upd"]
